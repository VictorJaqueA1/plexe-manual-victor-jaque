site_name: Manual de Plexe
site_description: Documentación completa del framework Plexe para simulación de platooning vehicular
site_author: Víctor Jaque
site_url: https://VictorJaqueA1.github.io/plexe-manual-victor-jaque/
repo_url: https://github.com/VictorJaqueA1/plexe-manual-victor-jaque
copyright: "© 2026 - Manual de Plexe"

theme:
  name: material
  custom_dir: overrides
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  icon:
    logo: material/car-connected
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/dropdown.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Arquitectura: arquitectura.md
  - Controladores: controladores.md
  - Casos prácticos:
    - ejemplos/index.md
    - Caso 1 · Variar el tiempo de separación h de Ploeg: ejemplos/caso-1.md
    - Caso 2 · Variar la potencia de transmisión: ejemplos/caso-2.md
    - Caso 3 · Pérdida artificial de paquetes con FER: ejemplos/caso-3.md
    - Caso 4 · Nuevo perfil de aceleración y velocidad del líder: ejemplos/caso-4.md
    - Caso 5 · Más de un pelotón: ejemplos/caso-5.md
    - Caso 6 · Retardo estocástico de comunicación: ejemplos/caso-6.md
    - Caso 7 · Event-triggered control sobre el envío de frames: ejemplos/caso-7.md
    - Caso 8 · ETC y retardo en conjunto: ejemplos/caso-8.md
